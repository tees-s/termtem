<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>เช็กลิสต์ · สอบกลางภาค 2/2569 ป.6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f6fb; --card:#fff; --ink:#1f1b2e; --muted:#6b6780; --line:#e4e1ee; --accent:#6d3fd6; --accent-soft:#efe8ff; --hi:#fff6c9; --ok:#1e8a4c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Sarabun',sans-serif; font-size:17px; line-height:1.65; }
  .wrap { max-width:820px; margin:0 auto; padding:16px 16px 70px; }
  .back { color:var(--accent); text-decoration:none; font-size:.95rem; font-weight:500; }
  h1 { margin:8px 0 2px; font-size:1.6rem; line-height:1.3; }
  .lead { margin:0 0 10px; color:var(--muted); }
  .lead b { color:var(--accent); }
  .sync { margin:-6px 0 6px; font-size:.82rem; color:var(--muted); min-height:1.2em; }
  .sync.off { color:#b45309; }
  .howto { background:var(--hi); border-radius:12px; padding:10px 14px; margin:12px 0; font-size:.95rem; }
  .group { margin:26px 0 8px; }
  .group h2 { margin:0; font-size:1.25rem; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .group h2 .cnt, .subj h3 .cnt { margin-left:auto; font-size:.85rem; font-weight:500; color:var(--muted); }
  .group > p { margin:2px 0 0; color:var(--muted); font-size:.93rem; }
  .subj { background:var(--card); border:1px solid var(--line); border-left:8px solid var(--line); border-radius:14px; padding:10px 14px; margin:10px 0; }
  .subj.alldone { border-color:var(--ok); }
  .subj h3 { margin:0 0 4px; font-size:1.05rem; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  ul.items { list-style:none; margin:0; padding:0; }
  ul.items li { display:flex; gap:10px; align-items:flex-start; padding:4px 0; }
  ul.items label { flex:1; display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  ul.items input { width:20px; height:20px; margin-top:5px; flex:none; accent-color:var(--accent); }
  ul.items .best { display:block; font-size:.85rem; color:var(--muted); }
  ul.items a { color:var(--accent); font-weight:700; text-decoration:none; white-space:nowrap; font-size:.92rem; margin-top:2px; }
  ul.items li.done .t { color:var(--muted); text-decoration:line-through; }
  .tools { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  button { font:inherit; font-size:.9rem; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  @media print { .back, .howto, .tools, ul.items a { display:none; } .subj { break-inside:avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← กลับหน้าแรก</a>
  <h1>เช็กลิสต์ สอบกลางภาค 2/2569</h1>
  <p class="lead">ทำเรื่องไหนเสร็จแล้วติ๊กไว้ ติ๊กที่เครื่องไหนก็เห็นเหมือนกันทุกเครื่อง · <b id="total"></b></p>
  <p class="sync" id="syncnote"></p>
  <div class="howto">แต่ละเรื่อง: กด “เปิด” อ่านสรุป → ลองทำข้อสอบเรื่องนั้น → ข้อไหนผิดอ่านคำอธิบายแล้วทำซ้ำจนถูกหมด → กลับมาติ๊ก · 📖 = ทำในหนังสือ</div>
  <div id="list"></div>
  <div class="tools"><button type="button" id="reset">ล้างเครื่องหมายถูกทั้งหมด</button><button type="button" onclick="window.print()">พิมพ์หน้านี้</button></div>
</div>

<script src="plan.js?v=20261113h"></script>
<script>
(function () {
  var state = todoLoad();
  var best = {};
  function loadBest() { try { best = JSON.parse(localStorage.getItem('termtem-quiz-best')) || {}; } catch (e) { best = {}; } }
  loadBest();
  var root = document.getElementById('list');
  // สำรอง: ถ้าได้ plan.js รุ่นเก่าที่ยังไม่มี todoSetMany ก็ยังเก็บในเครื่องได้
  function setMany(changes) {
    if (window.todoSetMany) return todoSetMany(changes);
    var s = todoLoad();
    Object.keys(changes).forEach(function (k) { if (changes[k]) s[k] = 1; else delete s[k]; });
    todoSave(s);
    return s;
  }
  var counters = [];   // [ฟังก์ชันนับใหม่] ของทุกวิชาและทุกกลุ่ม
  var boxes = [];      // ช่องติ๊กทุกช่อง {id, cb, li} ใช้อัปเดตเมื่อมีการติ๊กจากแท็บอื่น

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function countIn(items) {
    var n = 0;
    items.forEach(function (it) { if (state[todoId(it)]) n++; });
    return n;
  }
  function refresh() {
    counters.forEach(function (f) { f(); });
    var all = todoAll().map(function (x) { return x.item; });
    document.getElementById('total').textContent = 'ทำแล้ว ' + countIn(all) + '/' + all.length;
  }
  // คะแนนข้อสอบดีที่สุดของเรื่องนั้น (อัปเดตเมื่อปิดป๊อปอัปเนื้อหา หรือทำข้อสอบจากแท็บอื่น)
  function paintBest(b) {
    var s = b.bestKey ? best[b.bestKey] : null;
    if (!s) return;
    if (!b.bs) { b.bs = el('span', 'best'); b.t.appendChild(b.bs); }
    b.bs.textContent = 'ข้อสอบเรื่องนี้ ได้ดีที่สุด ' + s.score + '/' + s.total;
  }
  function repaintBest() { loadBest(); boxes.forEach(paintBest); }

  TODO.forEach(function (g) {
    var sec = el('section', 'group');
    var h2 = el('h2');
    h2.appendChild(el('span', null, g.title));
    var gcnt = el('span', 'cnt');
    h2.appendChild(gcnt);
    sec.appendChild(h2);
    sec.appendChild(el('p', null, g.when));
    var gItems = [];
    g.subjects.forEach(function (sj) {
      var box = el('div', 'subj');
      box.style.borderLeftColor = sj.color;
      var h3 = el('h3');
      h3.appendChild(el('span', null, sj.name));
      var scnt = el('span', 'cnt');
      h3.appendChild(scnt);
      box.appendChild(h3);
      var ul = el('ul', 'items');
      sj.items.forEach(function (it) {
        var id = todoId(it), li = el('li');
        var label = el('label'), cb = el('input');
        cb.type = 'checkbox';
        cb.checked = !!state[id];
        li.classList.toggle('done', cb.checked);
        cb.addEventListener('change', function () {
          // todoSet: อ่านของล่าสุดก่อนบันทึก (ไม่ทับแท็บอื่น) แล้วส่งขึ้น host ให้ทุกเครื่องเห็นเหมือนกัน
          var c = {}; c[id] = cb.checked ? 1 : 0;
          state = setMany(c);
          li.classList.toggle('done', cb.checked);
          refresh();
        });
        var t = el('span', 't', (it[0] ? '' : '📖 ') + it[2]);
        var target = todoTarget(it);   // เรื่องในเว็บ (งาน 📖 ก็มีเนื้อหาช่วยฝึก) — คะแนนดีที่สุดเก็บด้วยคีย์ 'วิชา:เรื่อง'
        var entry = { id: id, cb: cb, li: li, t: t, bestKey: target ? target[0] + ':' + target[1] : null };
        boxes.push(entry);
        paintBest(entry);
        label.appendChild(cb); label.appendChild(t); li.appendChild(label);
        // "เปิด" = ป๊อปอัปเนื้อหาเต็มจอทับหน้านี้ (todoLink ใน plan.js) ปิดแล้วอัปเดตคะแนนดีที่สุด
        if (target) {
          var a = el('a', null, 'เปิด →');
          a.href = todoHref(it); a.target = '_blank'; a.rel = 'noopener';   // สำรอง: คลิกกลาง / Ctrl+คลิก เปิดแท็บใหม่
          if (window.todoLink) todoLink(a, it, repaintBest);
          li.appendChild(a);
        }
        ul.appendChild(li);
      });
      box.appendChild(ul);
      sec.appendChild(box);
      gItems = gItems.concat(sj.items);
      counters.push(function () {
        var n = countIn(sj.items);
        scnt.textContent = n + '/' + sj.items.length;
        box.classList.toggle('alldone', n === sj.items.length);
      });
    });
    counters.push(function () { gcnt.textContent = 'ทำแล้ว ' + countIn(gItems) + '/' + gItems.length; });
    root.appendChild(sec);
  });
  refresh();
  function redraw() {
    state = todoLoad();
    boxes.forEach(function (b) { b.cb.checked = !!state[b.id]; b.li.classList.toggle('done', b.cb.checked); });
    refresh();
  }
  // ติ๊กจากอีกแท็บ (เช่น หน้าแรก): อัปเดตช่องติ๊กและตัวนับในแท็บนี้ให้ตรงกัน
  window.addEventListener('storage', function (e) {
    if (e.key === 'termtem-quiz-best') { repaintBest(); return; }
    if (e.key === TODO_KEY) redraw();
  });
  // ได้ของล่าสุดจาก host (ติ๊ก/คะแนนจากเครื่องอื่น) หรือส่งไม่สำเร็จ
  var syncNote = document.getElementById('syncnote');
  window.addEventListener('todo-sync', function (e) {
    if (e.detail === 'ok') { redraw(); repaintBest(); syncNote.textContent = '☁️ ติ๊กตรงกันทุกเครื่อง'; syncNote.className = 'sync'; }
    else { syncNote.textContent = '⚠️ ยังส่งการติ๊กขึ้นเว็บไม่ได้ (เน็ตหลุด?) ติ๊กไว้ในเครื่องนี้ก่อน จะส่งให้เองเมื่อเน็ตกลับมา'; syncNote.className = 'sync off'; }
  });
  if (window.todoSync) todoSync(true);

  // ล้างทั้งหมด = เอาติ๊กออกทุกรายการ ทุกเครื่อง
  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('ล้างเครื่องหมายถูกทั้งหมดในเช็กลิสต์? (ทุกเครื่องจะถูกล้างด้วย)')) return;
    var off = {};
    Object.keys(todoLoad()).forEach(function (k) { off[k] = 0; });
    state = setMany(off);
    redraw();
  });
})();
</script>
</body>
</html>
